services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: robot-pg
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: robot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - robot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  robot_pg_data:
