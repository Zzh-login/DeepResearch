<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音对话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #eef0f6;
            color: #2b2b35;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            text-align: center;
            color: #4a3b8a;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* ── 用户栏 ── */
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .user-name {
            font-size: 13px;
            color: #6b6b7b;
        }

        .user-name strong {
            color: #6a3de8;
            font-weight: 600;
        }

        .logout-btn {
            padding: 4px 14px;
            border-radius: 14px;
            border: 1px solid #d8d4e8;
            background: transparent;
            color: #6b6b7b;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: #8a7adf;
            color: #6a3de8;
        }

        /* ── 标签栏 ── */
        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #d8d4e8;
            background: transparent;
            color: #6b6b7b;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: #efe9fb;
            border-color: #8a7adf;
            color: #6a3de8;
        }

        .tab:hover { border-color: #8a7adf; }

        /* ── 主面板 ── */
        .main-panel { display: block; }
        .main-panel.hidden { display: none; }

        /* ── 角色行 ── */
        .role-row {
            background: #ffffff;
            border: 1px solid #e3e3ec;
            border-radius: 16px;
            padding: 14px 16px 10px;
            position: relative;
            box-shadow: 0 1px 3px rgba(30, 30, 60, 0.06);
        }

        .role-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .role-label span { font-size: 13px; color: #6b6b7b; }
        .role-label .role-status { font-size: 12px; color: #9a9aab; }
        .role-label .role-status.custom { color: #6a3de8; }

        .role-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .role-input-row input {
            flex: 1;
            padding: 10px 14px;
            background: #f4f4f8;
            border: 1px solid #e3e3ec;
            border-radius: 12px;
            color: #2b2b35;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .role-input-row input:focus { border-color: #8a7adf; }
        .role-input-row input::placeholder { color: #9a9aab; }

        .role-dropdown-btn {
            padding: 10px 12px;
            background: #f4f4f8;
            border: 1px solid #e3e3ec;
            border-radius: 12px;
            color: #6b6b7b;
            font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.2s;
            min-width: 44px;
        }
        .role-dropdown-btn:hover { border-color: #8a7adf; }

        .role-dropdown-list {
            display: none;
            position: absolute;
            right: 16px;
            top: 80px;
            width: calc(100% - 32px);
            max-width: 488px;
            background: #ffffff;
            border: 1px solid #e3e3ec;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(30, 30, 60, 0.15);
        }
        .role-dropdown-list.show { display: block; }

        .role-dropdown-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #f0f0f5;
        }
        .role-dropdown-item:hover { background: #f6f4fc; }
        .role-dropdown-item:last-child { border-bottom: none; }

        .role-dropdown-item span {
            flex: 1;
            font-size: 13px;
            color: #3b3b48;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .role-dropdown-item .del-btn {
            width: 28px; height: 28px;
            border: none; background: transparent;
            color: #9a9aab; font-size: 18px;
            cursor: pointer; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-left: 8px;
        }
        .role-dropdown-item .del-btn:hover {
            background: rgba(255, 80, 80, 0.12);
            color: #ff6b6b;
        }

        /* ── 对话区域 ── */
        .chat-panel {
            background: #ffffff;
            border: 1px solid #e3e3ec;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 1px 3px rgba(30, 30, 60, 0.06);
        }

        .chat-area {
            min-height: 260px;
            max-height: 360px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px 0;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb {
            background: #c8c8d4;
            border-radius: 2px;
        }

        .chat-empty {
            text-align: center;
            color: #9a9aab;
            font-size: 14px;
            padding: 40px 0;
        }

        .chat-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .chat-msg.user {
            align-self: flex-end;
            background: #6a3de8;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.assistant {
            align-self: flex-start;
            background: #f1f2f6;
            color: #2b2b35;
            border-bottom-left-radius: 4px;
            position: relative;
            padding-bottom: 22px;
        }
        /* Markdown 渲染后的段落与列表排版（中文行距、克制留白） */
        .chat-msg.assistant p { margin: 0 0 8px; }
        .chat-msg.assistant p:last-child { margin-bottom: 0; }
        .chat-msg.assistant ul,
        .chat-msg.assistant ol { margin: 4px 0 10px; padding-left: 22px; }
        .chat-msg.assistant li { margin: 3px 0; line-height: 1.55; }
        .chat-msg.assistant strong { color: #6a3de8; font-weight: 700; }

        /* 流式打字机闪烁光标 */
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #6a3de8;
            margin-left: 1px;
            vertical-align: text-bottom;
            animation: blink 0.7s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 正在朗读的气泡：柔和紫色微光，直观指示当前读到的位置（用 transition 避免与入场动画冲突） */
        .chat-msg.speaking {
            box-shadow: 0 0 0 1px #8a7adf, 0 0 16px rgba(106, 61, 232, 0.25);
            transition: box-shadow 0.35s ease, background 0.35s ease;
        }

        /* 重读按钮：助手消息右下角始终可见（半透明），hover 时变亮 */
        .replay-btn {
            position: absolute;
            right: 8px;
            bottom: 4px;
            border: none;
            background: #e6e6ef;
            color: #6b6b7b;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            border-radius: 8px;
            padding: 3px 7px;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }
        .chat-msg.assistant:hover .replay-btn { opacity: 1; }
        .replay-btn:hover { background: #dcdcf0; }

        /* ── 底部输入行 ── */
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .text-input-wrap {
            flex: 1;
            display: flex;
            background: #ffffff;
            border: 1px solid #e3e3ec;
            border-radius: 24px;
            overflow: hidden;
            transition: border-color 0.2s;
            box-shadow: 0 1px 3px rgba(30, 30, 60, 0.06);
        }
        .text-input-wrap:focus-within {
            border-color: #8a7adf;
        }

        .text-input-wrap input {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: #2b2b35;
            font-size: 14px;
            outline: none;
        }
        .text-input-wrap input::placeholder {
            color: #9a9aab;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a3de8, #9b59b6);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .mic-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #6a3de8, #9b59b6);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(106, 61, 232, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(106, 61, 232, 0.5);
        }
        .mic-btn:active { transform: scale(0.95); }

        .mic-btn.recording {
            background: linear-gradient(135deg, #e74c3c, #e84393);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.5); }
            50%      { box-shadow: 0 0 0 18px rgba(231, 76, 60, 0); }
        }

        .status-text {
            text-align: center;
            color: #8a8a9a;
            font-size: 12px;
            min-height: 18px;
        }
        .status-text.listening { color: #8a5cf0; }

        /* ── API 面板 ── */
        .api-panel {
            display: none;
            background: #ffffff;
            border: 1px solid #e3e3ec;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 1px 3px rgba(30, 30, 60, 0.06);
        }
        .api-panel.show { display: block; }

        .api-group { margin-bottom: 14px; }
        .api-group label {
            display: block;
            font-size: 13px;
            color: #6b6b7b;
            margin-bottom: 6px;
        }
        .api-group input {
            width: 100%;
            padding: 10px 14px;
            background: #f4f4f8;
            border: 1px solid #e3e3ec;
            border-radius: 10px;
            color: #2b2b35;
            font-size: 13px;
            outline: none;
        }
        .api-group input:focus { border-color: #8a7adf; }

        .api-status { font-size: 12px; color: #8a8a9a; margin-top: 4px; }

        .api-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-outline {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #d8d4e8;
            background: transparent;
            color: #6a3de8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            border-color: #8a7adf;
            background: #efe9fb;
        }

        .btn-solid {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #6a3de8, #9b59b6);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-solid:hover { opacity: 0.9; }

        /* ── 语音模式栏 ── */
        .tts-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }
        .tts-label {
            font-size: 12px;
            color: #6b6b7b;
            flex-shrink: 0;
        }
        .tts-opt {
            padding: 5px 14px;
            border-radius: 14px;
            border: 1px solid #d8d4e8;
            background: transparent;
            color: #6b6b7b;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tts-opt:hover { border-color: #8a7adf; }
        .tts-opt.active {
            background: #efe9fb;
            border-color: #8a7adf;
            color: #6a3de8;
        }
        .voice-select {
            flex: 1;
            padding: 5px 10px;
            background: #f4f4f8;
            border: 1px solid #e3e3ec;
            border-radius: 12px;
            color: #2b2b35;
            font-size: 12px;
            outline: none;
        }
        .chat-mode-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 8px 0;
            flex-wrap: wrap;
        }

        .chat-mode-bar label {
            color: #6b6b7b;
            font-size: 13px;
        }

        .chat-mode-bar select {
            min-height: 36px;
            max-width: 260px;
            padding: 0 32px 0 10px;
            border: 1px solid #d8d4e8;
            border-radius: 6px;
            background: #ffffff;
            color: #2b2b35;
        }

        #knowledgePickerWrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #knowledgePickerWrap[hidden] {
            display: none;
        }

        #refreshKnowledgeBtn {
            width: 36px;
            height: 36px;
            border: 1px solid #e3e3ec;
            border-radius: 6px;
            background: #f4f4f8;
            color: #6b6b7b;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .chat-mode-bar,
            #knowledgePickerWrap {
                align-items: stretch;
                width: 100%;
            }

            .chat-mode-bar select,
            #knowledgeBaseSelect {
                flex: 1;
                min-width: 0;
            }
        }
        .mode-badge {
            display: block;
            width: fit-content;
            margin-bottom: 6px;
            font-size: 11px;
            color: #6b6b7b;
        }

        .mode-knowledge {
            color: #1f8f5f;
        }

        .mode-hybrid {
            color: #b16a24;
        }

        .mode-normal {
            color: #606575;
        }

        .route-note {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            color: #707080;
            font-size: 12px;
            line-height: 1.5;
        }

        .citation-list {
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }

        .citation-card {
            border-left: 3px solid #3aa877;
            border-radius: 4px;
            background: #f5f6fa;
            padding: 10px 12px;
        }

        .citation-title {
            color: #2b2b35;
            font-size: 13px;
            font-weight: 600;
        }

        .citation-meta {
            margin-top: 3px;
            color: #8a8a99;
            font-size: 12px;
        }

        .citation-excerpt {
            margin-top: 7px;
            color: #4a4a55;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
        }
        .research-panel {
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #dfe2e8;
            border-radius: 6px;
            background: #ffffff;
        }
        .research-panel[hidden] { display: none; }
        .research-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        #researchQuery {
            margin-top: 4px;
            color: #606575;
            overflow-wrap: anywhere;
        }
        .research-progress {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) auto;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
        }
        #researchProgress { width: 100%; }
        #researchReport { line-height: 1.7; overflow-wrap: anywhere; }
        #researchSources { display: grid; gap: 8px; margin-top: 12px; }
        @media (max-width: 640px) {
            .research-progress { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>语音对话</h1>

    <!-- 用户栏 -->
    <div class="user-bar">
        <span class="user-name" id="userNameDisplay"></span>
        <button class="logout-btn" id="logoutBtn">退出</button>
    </div>

    <!-- 标签栏 -->
    <div class="tabs">
        <button class="tab active" id="tabChat">对话</button>
        <button class="tab" id="tabApi">API 设置</button>
    </div>

    <!-- 语音模式栏 -->
    <div class="tts-bar">
        <span class="tts-label">语音</span>
        <button class="tts-opt active" data-mode="cloud">云语音</button>
        <button class="tts-opt" data-mode="local">本机语音</button>
        <select id="voiceSelect" class="voice-select" style="display:none;"></select>
    </div>

    <!-- 主面板 -->
    <div class="main-panel" id="mainPanel">
        <!-- 角色行 -->
        <div class="role-row" id="roleRow">
            <div class="role-label">
                <span>角色设定</span>
                <span class="role-status" id="roleStatus"></span>
            </div>
            <div class="role-input-row">
                <input
                    type="text"
                    id="personaInput"
                    placeholder="你是一个友好、专业的AI语音助手..."
                    autocomplete="off"
                >
                <button class="role-dropdown-btn" id="roleDropdownBtn" title="历史角色">&#9660;</button>
            </div>
            <div class="role-dropdown-list" id="roleDropdownList"></div>
        </div>

        <div class="chat-mode-bar" aria-label="回答方式">
            <label for="chatModeSelect">回答方式</label>
            <select id="chatModeSelect">
                <option value="auto">自动</option>
                <option value="normal">普通聊天</option>
                <option value="knowledge">仅知识库</option>
                <option value="hybrid">混合问答</option>
                <option value="deep_research">深度研究</option>
            </select>

            <div id="knowledgePickerWrap" hidden>
                <label for="knowledgeBaseSelect">知识库</label>
                <select id="knowledgeBaseSelect">
                    <option value="">请选择知识库</option>
                </select>
                <button type="button" id="refreshKnowledgeBtn" title="刷新知识库">&#8635;</button>
            </div>
        </div>

        <!-- 对话区域 -->
        <div class="chat-panel">
            <div class="chat-area" id="chatArea">
                <div class="chat-empty" id="chatEmpty">可以开始对话</div>
            </div>
        </div>

        <!-- 深度研究区域 -->
        <section class="research-panel" id="researchPanel" hidden>
            <div class="research-header">
                <div>
                    <strong>深度研究</strong>
                    <div id="researchQuery"></div>
                </div>
                <button type="button" id="cancelResearchBtn" hidden>取消</button>
            </div>
            <div class="research-progress">
                <progress id="researchProgress" max="100" value="0"></progress>
                <span id="researchStep">等待开始</span>
            </div>
            <article id="researchReport"></article>
            <div id="researchSources"></div>
        </section>

        <!-- 输入行 -->
        <div class="input-row" style="margin-top:4px;">
            <div class="text-input-wrap">
                <input
                    type="text"
                    id="textInput"
                    placeholder="输入文字，按 Enter 发送..."
                    autocomplete="off"
                >
                <button class="send-btn" id="sendBtn" title="发送">&#9654;</button>
            </div>
            <button class="mic-btn" id="micBtn" title="按住说话">&#127908;</button>
        </div>

        <div class="status-text" id="statusText"></div>
    </div>

    <!-- API 面板 -->
    <div class="api-panel" id="apiPanel">
        <div class="api-group">
            <label>API Key</label>
            <input type="password" id="apiKey" placeholder="默认 DeepSeek Key" autocomplete="off">
        </div>
        <div class="api-group">
            <label>Base URL</label>
            <input type="text" id="apiBaseUrl" placeholder="https://api.deepseek.com">
        </div>
        <div class="api-group">
            <label>Model</label>
            <input type="text" id="apiModel" placeholder="deepseek-chat">
        </div>
        <div class="api-status" id="apiStatus">状态：默认配置</div>
        <div class="api-actions">
            <button class="btn-outline" id="btnApiReset">恢复默认</button>
            <button class="btn-solid" id="btnApiSave">保存</button>
        </div>
    </div>
</div>

<script>
// ==================== DOM ====================
const tabChat = document.getElementById("tabChat");
const tabApi = document.getElementById("tabApi");
const mainPanel = document.getElementById("mainPanel");
const apiPanel = document.getElementById("apiPanel");

const personaInput = document.getElementById("personaInput");
const roleStatus = document.getElementById("roleStatus");
const roleDropdownBtn = document.getElementById("roleDropdownBtn");
const roleDropdownList = document.getElementById("roleDropdownList");

const chatArea = document.getElementById("chatArea");
const chatEmpty = document.getElementById("chatEmpty");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const statusText = document.getElementById("statusText");

const apiKey = document.getElementById("apiKey");
const apiBaseUrl = document.getElementById("apiBaseUrl");
const apiModel = document.getElementById("apiModel");
const apiStatusEl = document.getElementById("apiStatus");

const chatModeSelect = document.getElementById("chatModeSelect");
const knowledgePickerWrap = document.getElementById("knowledgePickerWrap");

function stopResearchPolling() {
    if (researchPollTimer !== null) {
        window.clearTimeout(researchPollTimer);
        researchPollTimer = null;
    }
}

function safeResearchUrl(value) {
    try {
        const parsed = new URL(value, window.location.origin);
        return ["http:", "https:"].includes(parsed.protocol)
            ? parsed.href
            : null;
    } catch (_) {
        return null;
    }
}

function renderResearchSources(sources) {
    researchSources.textContent = "";
    for (const source of sources) {
        const card = document.createElement("div");
        card.className = "citation-card";
        const title = document.createElement("strong");
        title.textContent = `${source.source_id} · ${source.title}`;
        const excerpt = document.createElement("p");
        excerpt.textContent = source.excerpt || "";
        card.append(title, excerpt);

        const safeUrl = source.url ? safeResearchUrl(source.url) : null;
        if (safeUrl) {
            const link = document.createElement("a");
            link.href = safeUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "打开来源";
            card.appendChild(link);
        }
        researchSources.appendChild(card);
    }
}

function showResearchTask(task) {
    researchPanel.hidden = false;
    researchQuery.textContent = task.query || "";
    researchProgress.value = Number(task.progress || 0);
    researchStep.textContent = task.current_step || task.status;

    if (task.status === "completed") {
        researchReport.innerHTML = renderMd(task.report?.markdown || "");
        renderResearchSources(task.sources || []);
        cancelResearchBtn.hidden = true;
        activeResearchTaskId = null;
        localStorage.removeItem("activeResearchTaskId");
        localStorage.setItem("lastResearchTaskId", task.id);
        stopResearchPolling();
        return;
    }

    if (["failed", "cancelled"].includes(task.status)) {
        researchReport.textContent = task.error_message || "任务已取消";
        researchSources.textContent = "";
        cancelResearchBtn.hidden = true;
        activeResearchTaskId = null;
        localStorage.removeItem("activeResearchTaskId");
        localStorage.setItem("lastResearchTaskId", task.id);
        stopResearchPolling();
        return;
    }

    activeResearchTaskId = task.id;
    localStorage.setItem("activeResearchTaskId", task.id);
    researchReport.textContent = "";
    researchSources.textContent = "";
    cancelResearchBtn.hidden = false;
}

async function startResearch(query) {
    if (activeResearchTaskId) {
        throw new Error("已有研究任务正在运行，请先等待或取消");
    }
    const response = await fetch("/api/research-tasks", {
        method: "POST",
        credentials: "include",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            query,
            knowledge_base_id: activeKnowledgeBaseId || null
        })
    });
    if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "研究任务创建失败");
    }
    const task = await response.json();
    showResearchTask({
        ...task,
        query,
        progress: 0,
        current_step: "等待处理",
        sources: []
    });
    await pollResearchTask();
}

async function pollResearchTask() {
    if (!activeResearchTaskId) return;
    try {
        const response = await fetch(
            `/api/research-tasks/${activeResearchTaskId}`,
            {credentials: "include"}
        );
        if (response.status === 401) {
            window.location.replace("/login");
            return;
        }
        if (response.status === 404) {
            activeResearchTaskId = null;
            localStorage.removeItem("activeResearchTaskId");
            localStorage.removeItem("lastResearchTaskId");
            researchPanel.hidden = true;
            stopResearchPolling();
            return;
        }
        if (!response.ok) throw new Error("任务查询失败");
        const task = await response.json();
        showResearchTask(task);
        if (activeResearchTaskId) {
            researchPollTimer = window.setTimeout(pollResearchTask, 2000);
        }
    } catch (_) {
        researchStep.textContent = "连接暂时中断，正在重试";
        researchPollTimer = window.setTimeout(pollResearchTask, 3000);
    }
}

async function loadResearchTasks() {
    const savedId = localStorage.getItem("activeResearchTaskId");
    if (savedId) {
        activeResearchTaskId = savedId;
        await pollResearchTask();
        if (activeResearchTaskId) return;
        if (!researchPanel.hidden) return;
    }

    const lastId = localStorage.getItem("lastResearchTaskId");
    if (lastId) {
        activeResearchTaskId = lastId;
        await pollResearchTask();
        if (!researchPanel.hidden) return;
    }

    const response = await fetch("/api/research-tasks", {
        credentials: "include"
    });
    if (!response.ok) return;
    const tasks = await response.json();
    const task = tasks.find(item =>
        ["pending", "running"].includes(item.status)
    ) || tasks.find(item => item.status === "completed");
    if (task) {
        activeResearchTaskId = task.id;
        await pollResearchTask();
    }
}

cancelResearchBtn.addEventListener("click", async () => {
    if (!activeResearchTaskId) return;
    cancelResearchBtn.disabled = true;
    const response = await fetch(
        `/api/research-tasks/${activeResearchTaskId}/cancel`, {
        method: "POST",
        credentials: "include"
    });
    cancelResearchBtn.disabled = false;
    if (response.ok) await pollResearchTask();
});

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

// 轻量 Markdown → HTML：行级列表 + 行内加粗/斜体；先 escapeHtml 防 XSS
function inlineMd(s) {
    return s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>");
}
// 朗读前去除 Markdown 符号，避免本机语音念出「星号」
function stripMd(s) {
    return s
        .replace(/\*\*/g, "")
        .replace(/^\s*[-*]\s+/gm, "")
        .replace(/[*_`>#]/g, "")
        .replace(/\n{2,}/g, "。")
        .replace(/\n/g, " ");
}
function renderMd(text) {
    const lines = escapeHtml(text).split("\n");
    const out = [];
    let listType = null; // 'ul' | 'ol'
    const closeList = () => {
        if (listType) {
            out.push(`</${listType}>`);
            listType = null;
        }
    };
    for (const raw of lines) {
        const line = raw.replace(/\s+$/, ""); // 去尾部空白
        let m;
        if ((m = line.match(/^\*\s+(.*)$/)) || (m = line.match(/^-\s+(.*)$/))) {
            // 无序列表：* 或 - 开头
            if (listType !== "ul") {
                closeList();
                out.push("<ul>");
                listType = "ul";
            }
            out.push(`<li>${inlineMd(m[1])}</li>`);
        } else if ((m = line.match(/^\d+\.\s+(.*)$/))) {
            // 有序列表：1. 开头
            if (listType !== "ol") {
                closeList();
                out.push("<ol>");
                listType = "ol";
            }
            out.push(`<li>${inlineMd(m[1])}</li>`);
        } else {
            closeList();
            if (line.trim() === "") continue; // 空行作为段落分隔，不渲染
            out.push(`<p>${inlineMd(line)}</p>`);
        }
    }
    closeList();
    return out.join("");
}

async function loadKnowledgeBases() {
    knowledgeBaseSelect.innerHTML = '<option value="">请选择知识库</option>';
    try {
        const response = await fetch("/api/knowledge-bases", {
            credentials: "include"
        });
        if (response.status === 401) {
            window.location.href = "/login";
            return;
        }
        if (!response.ok) throw new Error("知识库列表加载失败");

        const knowledgeBases = await response.json();
        for (const item of knowledgeBases) {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.name;
            knowledgeBaseSelect.appendChild(option);
        }

        const stillExists = knowledgeBases.some(
            item => item.id === activeKnowledgeBaseId
        );
        if (!stillExists) {
            activeKnowledgeBaseId = "";
            localStorage.removeItem("knowledgeBaseId");
        }
        if (!activeKnowledgeBaseId && knowledgeBases.length === 1) {
            activeKnowledgeBaseId = knowledgeBases[0].id;
            localStorage.setItem("knowledgeBaseId", activeKnowledgeBaseId);
        }
        knowledgeBaseSelect.value = activeKnowledgeBaseId;
    } catch (error) {
        statusText.textContent = "知识库列表暂时无法加载";
        statusText.className = "status-text error";
    }
}

function applyChatMode(mode) {
    activeChatMode = mode;
    localStorage.setItem("chatMode", mode);
    chatModeSelect.value = mode;

    const needsKnowledgeBase = ["auto", "knowledge", "hybrid", "deep_research"].includes(mode);
    knowledgePickerWrap.hidden = !needsKnowledgeBase;

    const placeholders = {
        auto: "自动选择回答方式...",
        normal: "输入文字，按 Enter 发送...",
        knowledge: "仅依据选中的知识库提问...",
        hybrid: "结合知识库与通用知识提问..."
    };
    textInput.placeholder = placeholders[mode] || placeholders.normal;
}

chatModeSelect.addEventListener("change", async event => {
    if (responseInProgress) {
        event.target.value = activeChatMode;
        statusText.textContent = "请等待当前回答完成后再切换模式";
        return;
    }
    applyChatMode(event.target.value);
    if (["auto", "knowledge", "hybrid", "deep_research"].includes(activeChatMode)) {
        await loadKnowledgeBases();
    }
});

knowledgeBaseSelect.addEventListener("change", event => {
    activeKnowledgeBaseId = event.target.value;
    if (activeKnowledgeBaseId) {
        localStorage.setItem("knowledgeBaseId", activeKnowledgeBaseId);
    } else {
        localStorage.removeItem("knowledgeBaseId");
    }
});

refreshKnowledgeBtn.addEventListener("click", loadKnowledgeBases);

// ==================== 文字发送 ====================
async function sendText(text) {
    if (!text || responseInProgress) return;

    if (activeChatMode === "deep_research") {
        appendMessage(text, "user", "deep_research");
        try {
            await startResearch(text);
            statusText.textContent = "研究任务已创建，可切换模式继续聊天";
        } catch (error) {
            statusText.textContent = error.message;
            statusText.className = "status-text error";
        }
        return;
    }

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        statusText.textContent = "连接已断开，正在重连...";
        appendMessage("(消息未发送：连接断开)", "assistant", activeChatMode);
        return;
    }
    if (["auto", "knowledge", "hybrid"].includes(activeChatMode)
            && !activeKnowledgeBaseId) {
        statusText.textContent = "请先选择一个知识库";
        knowledgeBaseSelect.focus();
        return;
    }

    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    if (window.speechSynthesis) speechSynthesis.cancel();

    responseInProgress = true;
    sendBtn.disabled = true;
    chatModeSelect.disabled = true;
    knowledgeBaseSelect.disabled = true;
    appendMessage(text, "user", activeChatMode);

    ws.send(JSON.stringify({
        action: "chat",
        text,
        mode: activeChatMode,
        knowledge_base_id: ["auto", "knowledge", "hybrid"].includes(
            activeChatMode
        ) ? activeKnowledgeBaseId : null,
        tts_mode: ttsMode,
        agent_mode: true
    }));
}

textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        const text = textInput.value.trim();
        if (text) {
            sendText(text);
            textInput.value = "";
        }
    }
});

sendBtn.addEventListener("click", () => {
    const text = textInput.value.trim();
    if (text) {
        sendText(text);
        textInput.value = "";
    }
});

function finishResponse() {
    responseInProgress = false;
    sendBtn.disabled = false;
    chatModeSelect.disabled = false;
    knowledgeBaseSelect.disabled = false;
}

// ==================== WebSocket ====================
let currentAudio = null;
let currentSpeakingEl = null;   // 正在朗读的气泡（用于高亮）
let lastAssistantEl = null;     // 最近一条助手消息（云语音音频回传时定位用）

function setSpeakingEl(el) {
    if (currentSpeakingEl && currentSpeakingEl !== el) {
        currentSpeakingEl.classList.remove("speaking");
    }
    currentSpeakingEl = el;
    if (el) el.classList.add("speaking");
}
function clearSpeakingEl() {
    if (currentSpeakingEl) currentSpeakingEl.classList.remove("speaking");
    currentSpeakingEl = null;
}

function connectWS() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => {
        statusText.textContent = "";
        statusText.className = "status-text";
    };

    ws.onmessage = event => {
        const data = JSON.parse(event.data);

        if (data.type === "chat.history") {
            appendMessage(data.text, data.role || "assistant", "normal");
            return;
        }

        if (data.type === "chat.token") {
            streamBuffer += data.text || "";
            if (!streamEl) streamEl = createStreamBubble();
            streamEl.innerHTML = renderMd(streamBuffer) +
                '<span class="cursor-blink"></span>';
            chatArea.scrollTop = chatArea.scrollHeight;
            return;
        }

        if (data.type === "chat.done") {
            let answerEl;
            if (data.mode === "normal" && streamEl) {
                finalizeStreamBubble(data.text);
                answerEl = streamEl;
            } else {
                answerEl = appendMessage(data.text, "assistant", data.mode);
            }

            appendModeBadge(
                answerEl,
                data.mode,
                data.requested_mode || data.mode
            );

            if (["knowledge", "hybrid"].includes(data.mode)) {
                appendCitationCards(answerEl, data.citations || []);
            }

            if (data.requested_mode === "auto" && data.route_reason) {
                const routeNote = document.createElement("div");
                routeNote.className = "route-note";
                const confidence = Number(data.route_confidence || 0);
                routeNote.textContent =
                    `自动选择原因：${data.route_reason}` +
                    (confidence ? `（置信度 ${confidence.toFixed(2)}）` : "");
                answerEl.appendChild(routeNote);
            }

            if (ttsMode === "local" && !voiceInputActive) {
                speakLocal(data.text, answerEl);
            }
            streamBuffer = "";
            streamEl = null;
            if (ttsMode === "local" || data.error) {
                finishResponse();
            } else {
                statusText.textContent = "正在生成语音...";
            }
            return;
        }

        if (data.type === "chat.error") {
            appendMessage(data.message || "处理失败", "assistant", data.mode);
            statusText.textContent = data.message || "处理失败";
            statusText.className = "status-text error";
            streamBuffer = "";
            streamEl = null;
            finishResponse();
            return;
        }

        if (data.type === "tts.done") {
            if (data.audio && !voiceInputActive) {
                playAudio(data.audio, lastAssistantEl);
            }
            statusText.textContent = "";
            statusText.className = "status-text";
            finishResponse();
        }
    };

    ws.onclose = event => {
        finishResponse();
        streamBuffer = "";
        streamEl = null;

        if (event.code === 4401) {
            statusText.textContent = "登录已失效，正在跳转登录页...";
            statusText.className = "status-text error";
            window.location.href = "/login";
            return;
        }

        statusText.textContent = "连接断开，3秒后重连...";
        statusText.className = "status-text";
        window.setTimeout(connectWS, 3000);
    };

    ws.onerror = () => {
        statusText.textContent = "聊天连接发生错误";
        statusText.className = "status-text error";
    };
}

// ==================== 流式打字机辅助 ====================
function createStreamBubble() {
    chatEmpty.style.display = "none";
    const div = document.createElement("div");
    div.className = "chat-msg assistant";
    div.innerHTML = renderMd(streamBuffer) + '<span class="cursor-blink"></span>';
    chatArea.appendChild(div);
    lastAssistantEl = div;
    return div;
}

function finalizeStreamBubble(text) {
    if (!streamEl) return;
    // 去掉光标元素
    const cursor = streamEl.querySelector(".cursor-blink");
    if (cursor) cursor.remove();
    // 加重新朗读按钮
    const btn = document.createElement("button");
    btn.className = "replay-btn";
    btn.title = "重新朗读";
    btn.textContent = "🔊";
    btn.addEventListener("click", () => replay(text, btn));
    streamEl.appendChild(btn);
}

function appendCitationCards(messageEl, citations) {
    if (!messageEl || !Array.isArray(citations) || citations.length === 0) return;

    const section = document.createElement("div");
    section.className = "citation-list";

    for (const citation of citations) {
        const card = document.createElement("div");
        card.className = "citation-card";

        const title = document.createElement("div");
        title.className = "citation-title";
        title.textContent = `${citation.source_id} · ${citation.filename}`;

        const meta = document.createElement("div");
        meta.className = "citation-meta";
        const parts = [];
        if (citation.page_number !== null && citation.page_number !== undefined) {
            parts.push(`第 ${citation.page_number} 页`);
        }
        if (citation.section_title) parts.push(citation.section_title);
        parts.push(`切片 ${citation.chunk_index}`);
        meta.textContent = parts.join(" · ");

        const excerpt = document.createElement("div");
        excerpt.className = "citation-excerpt";
        excerpt.textContent = citation.excerpt || "";

        card.append(title, meta, excerpt);
        section.appendChild(card);
    }
    messageEl.appendChild(section);
}

function modeLabel(mode) {
    return {
        auto: "自动",
        normal: "普通聊天",
        knowledge: "仅知识库",
        hybrid: "混合问答"
    }[mode] || mode || "未知模式";
}

function appendModeBadge(messageEl, mode, requestedMode = mode) {
    if (!messageEl || !mode) return;
    const oldBadge = messageEl.querySelector(".mode-badge");
    if (oldBadge) oldBadge.remove();

    const badge = document.createElement("span");
    badge.className = `mode-badge mode-${mode}`;
    badge.textContent = requestedMode === "auto"
        ? `自动 -> ${modeLabel(mode)}`
        : modeLabel(mode);
    messageEl.prepend(badge);
}

function appendMessage(text, role, mode = "normal") {
    chatEmpty.style.display = "none";
    const div = document.createElement("div");
    div.className = `chat-msg ${role}`;
    div.innerHTML = role === "assistant" ? renderMd(text) : escapeHtml(text);
    appendModeBadge(div, mode);

    if (role === "assistant") {
        lastAssistantEl = div;
        const btn = document.createElement("button");
        btn.className = "replay-btn";
        btn.title = "重新朗读";
        btn.textContent = "🔊";
        btn.addEventListener("click", () => replay(text, btn));
        div.appendChild(btn);
    }
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
}

// 重读：本机语音直接本地朗读；云语音请求后端重新合成
function replay(text, btn) {
    if (!text) return;
    const el = btn ? btn.parentElement : null;
    if (ttsMode === "local") {
        speakLocal(text, el);
    } else {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            statusText.textContent = "连接已断开，无法重读";
            return;
        }
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        if (window.speechSynthesis) speechSynthesis.cancel();
        // 记下要高亮的气泡，云音频回传时（单独消息）再点亮
        lastAssistantEl = el || lastAssistantEl;
        ws.send(JSON.stringify({ action: "tts", text }));
    }
}

function playAudio(b64, el) {
    if (!b64) return;
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    const audio = new Audio(`data:audio/mp3;base64,${b64}`);
    setSpeakingEl(el);
    const finish = () => { clearSpeakingEl(); currentAudio = null; };
    audio.onended = finish;
    audio.onerror = finish;
    audio.play().catch(finish);
    currentAudio = audio;
}

// ==================== 本地语音（浏览器 Web Speech API） ====================
// 走 Windows 本机已装语音，零网络、零云费用；音色下拉自动列出可用语音（优先中文）。
let ttsMode = localStorage.getItem("ttsMode") || "cloud";
let selectedVoice = localStorage.getItem("selectedVoice") || "";
let voices = [];

const voiceSelect = document.getElementById("voiceSelect");

function populateVoices() {
    if (!("speechSynthesis" in window)) return;
    voices = speechSynthesis.getVoices() || [];
    if (!voices.length) return;
    const zh = voices.filter(v => /^zh/i.test(v.lang));
    const list = zh.length ? zh : voices;
    voiceSelect.innerHTML = list.map(v =>
        `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)} · ${v.lang}</option>`
    ).join("");
    if (selectedVoice && list.some(v => v.name === selectedVoice)) {
        voiceSelect.value = selectedVoice;
    } else {
        selectedVoice = list.length ? list[0].name : "";
        voiceSelect.value = selectedVoice;
    }
}

function currentVoiceObj() {
    return voices.find(v => v.name === selectedVoice) || null;
}

// 按句切分，避免浏览器对超长文本（约 15s）截断
function splitIntoSentences(text) {
    const parts = text.match(/[^。！？!?；;\n]+[。！？!?；;\n]*/g);
    if (!parts) return [text];
    const out = parts.map(s => s.trim()).filter(Boolean);
    return out.length ? out : [text];
}

function speakLocal(text, el) {
    if (!("speechSynthesis" in window)) {
        statusText.textContent = "当前浏览器不支持本机语音";
        return;
    }
    const vobj = currentVoiceObj();
    const segs = splitIntoSentences(stripMd(text));
    if (!segs.length) { clearSpeakingEl(); return; }
    setSpeakingEl(el);
    const fire = () => segs.forEach((seg, i) => {
        const u = new SpeechSynthesisUtterance(seg);
        if (vobj) { u.voice = vobj; u.lang = vobj.lang; }
        else { u.lang = "zh-CN"; }
        u.rate = 1.0;
        if (i === segs.length - 1) u.onend = () => clearSpeakingEl();
        speechSynthesis.speak(u);
    });
    // 先停掉正在念的，再播新的；用 setTimeout 规避 Chrome「cancel 后首句被吞」的 bug
    if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel();
        setTimeout(fire, 80);
    } else {
        fire();
    }
}

function setTtsMode(mode) {
    ttsMode = mode;
    localStorage.setItem("ttsMode", mode);
    document.querySelectorAll(".tts-opt").forEach(b =>
        b.classList.toggle("active", b.dataset.mode === mode));
    voiceSelect.style.display = (mode === "local") ? "inline-block" : "none";
    if (mode === "cloud") speechSynthesis.cancel();
}

document.querySelectorAll(".tts-opt").forEach(b =>
    b.addEventListener("click", () => setTtsMode(b.dataset.mode)));
voiceSelect.addEventListener("change", (e) => {
    selectedVoice = e.target.value;
    localStorage.setItem("selectedVoice", selectedVoice);
});


// ==================== 语音识别 ====================
// ==================== 语音识别（WAV → SenseVoice） ====================
let asrWs = null;
let isRecording = false;
let voiceInputActive = false;  // 麦克风按下期间为真：抑制一切新到的播报（含重读回传）
let audioContext = null;
let streamSource = null;
let processor = null;
let pcmChunks = [];
let sampleRate = 16000;
let recordingTimeout = null;

function connectASR() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    asrWs = new WebSocket(`${proto}//${location.host}/ws/asr`);
    asrWs.onopen = () => {
        statusText.textContent = "";
        statusText.className = "status-text";
    };
    asrWs.onmessage = function (e) {
        try {
            const data = JSON.parse(e.data);
            if (data.text) {
                sendText(data.text);
                statusText.textContent = "";
                statusText.className = "status-text";
            }
        } catch (_) { }
    };
    asrWs.onclose = () => setTimeout(connectASR, 3000);
}

function encodeWAV(samples) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    function w(s, o) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    w('RIFF', 0); v.setUint32(4, 36 + samples.length * 2, true);
    w('WAVE', 8); w('fmt ', 12);
    v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, sampleRate, true);
    v.setUint32(28, sampleRate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w('data', 36); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
        v.setInt16(44 + i * 2, Math.max(-32768, Math.min(32767, samples[i] * 32767)), true);
    }
    return buf;
}

async function startRecording() {
    if (isRecording) return;
    if (!asrWs || asrWs.readyState !== WebSocket.OPEN) {
        statusText.textContent = "ASR 服务未连接";
        statusText.className = "status-text";
        return;
    }
    // 按下麦克风即让出语音通道：停掉云 mp3，也停掉本机语音朗读，并熄灭高亮
    voiceInputActive = true;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    clearSpeakingEl();

    const stream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: 16000, channelCount: 1 }
    });
    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
    streamSource = audioContext.createMediaStreamSource(stream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    pcmChunks = [];

    processor.onaudioprocess = (e) => {
        if (!isRecording) return;
        const input = e.inputBuffer.getChannelData(0);
        pcmChunks.push(new Float32Array(input));
    };

    streamSource.connect(processor);
    processor.connect(audioContext.destination);

    isRecording = true;
    micBtn.classList.add("recording");
    statusText.textContent = "聆听中...";
    statusText.className = "status-text listening";
    recordingTimeout = setTimeout(stopRecording, 30000);
}

function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    voiceInputActive = false;
    micBtn.classList.remove("recording");
    clearTimeout(recordingTimeout);

    try { processor.disconnect(); } catch (e) {}
    try { streamSource.disconnect(); } catch (e) {}
    try { audioContext.close(); } catch (e) {}

    if (pcmChunks.length === 0) {
        statusText.textContent = "未识别到语音";
        statusText.className = "status-text";
        return;
    }

    const all = new Float32Array(pcmChunks.reduce((s, c) => s + c.length, 0));
    let offset = 0;
    for (const c of pcmChunks) { all.set(c, offset); offset += c.length; }

    const wav = encodeWAV(all);
    if (asrWs && asrWs.readyState === WebSocket.OPEN) {
        statusText.textContent = "识别中...";
        statusText.className = "status-text";
        asrWs.send(wav);
    }
}

micBtn.addEventListener("mousedown", (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener("mouseup", stopRecording);
micBtn.addEventListener("mouseleave", () => { if (isRecording) stopRecording(); });
micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener("touchend", stopRecording);


// ==================== 认证 ====================
let currentUsername = "";

async function checkAuth() {
    try {
        const resp = await fetch("/auth/me");
        if (!resp.ok) throw new Error();
        const data = await resp.json();
        currentUsername = data.username;
        document.getElementById("userNameDisplay").innerHTML =
            '\u{1F464} <strong>' + escapeHtml(currentUsername) + '</strong>';
        return true;
    } catch (_) {
        window.location.replace("/login");
        return false;
    }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/auth/logout", { method: "POST" });
    window.location.href = "/login";
});

// ==================== 初始化 ====================
async function init() {
    const authenticated = await checkAuth();
    if (!authenticated) return;

    // 普通历史由 /ws 的 chat.history 事件回放。
    // 不再调用 loadHistory()，否则每条普通历史会显示两遍。
    await loadPersona();
    await loadPersonaHistory();
    await loadApiConfig();

    applyChatMode(activeChatMode);
    if (["auto", "knowledge", "hybrid", "deep_research"].includes(activeChatMode)) {
        await loadKnowledgeBases();
    }
    await loadResearchTasks();

    if ("speechSynthesis" in window) {
        populateVoices();
        speechSynthesis.onvoiceschanged = populateVoices;
    }
    setTtsMode(ttsMode);
    connectWS();
    connectASR();
}

init();
</script>
